<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stewardship OS</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --text-dim: #8b949e;
  --green: #3fb950; --green-bg: rgba(63,185,80,0.15);
  --amber: #d29922; --amber-bg: rgba(210,153,34,0.15);
  --blue: #58a6ff; --blue-bg: rgba(88,166,255,0.15);
  --purple: #bc8cff; --purple-bg: rgba(188,140,255,0.15);
  --pink: #f778ba; --pink-bg: rgba(247,120,186,0.15);
  --red: #f85149; --red-bg: rgba(248,81,73,0.15);
  --teal: #39d2c0; --teal-bg: rgba(57,210,192,0.15);
  --orange: #f0883e; --orange-bg: rgba(240,136,62,0.15);
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); }
#app { height: 100%; display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; }

/* Date Carousel */
.date-carousel { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 12px 0 8px; flex-shrink: 0; }
.date-arrow { background: none; border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
.date-arrow:active { background: var(--border); }
.date-arrow.disabled { opacity: 0.3; pointer-events: none; }
.date-label { font-size: 16px; font-weight: 700; min-width: 150px; text-align: center; letter-spacing: -0.3px; }
.date-sub { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: -4px; padding-bottom: 4px; flex-shrink: 0; }

/* Tile Grid */
.tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 4px 10px; flex: 1; align-content: start; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.tile { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); padding: 10px 4px 8px; text-align: center; cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px; }
.tile:active { transform: scale(0.96); }
.tile.done { border-color: var(--green); background: rgba(63,185,80,0.06); }
.tile.done .tile-icon { opacity: 0.6; }
.tile.done .tile-name { opacity: 0.6; }
.tile .tile-icon { font-size: 30px; line-height: 1; margin-bottom: 4px; }
.tile .tile-name { font-size: 14px; font-weight: 700; line-height: 1.2; letter-spacing: -0.2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .tile-stats { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
.tile .tile-streak { font-size: 12px; color: var(--amber); font-weight: 600; }
.tile .tile-total { font-size: 11px; color: var(--text-dim); }
.tile .tile-weekly { font-size: 11px; color: var(--text-dim); }
.tile .tile-hours { font-size: 12px; color: var(--teal); font-weight: 600; }
.tile .tile-weight { font-size: 12px; color: var(--pink); font-weight: 600; }
.tile .tile-check { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--green); color: var(--bg); font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; opacity: 0; transition: opacity 0.15s; }
.tile.done .tile-check { opacity: 1; }
.tile-notes-badge { position: absolute; top: 6px; left: 6px; font-size: 9px; color: var(--blue); }
.tile-not-due { opacity: 0.35; pointer-events: none; }

/* Bottom Bar */
.bottom-bar { flex-shrink: 0; height: 56px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.bottom-btn { background: none; border: none; color: var(--text-dim); font-size: 26px; cursor: pointer; padding: 8px 16px; -webkit-tap-highlight-color: transparent; transition: color 0.15s; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.bottom-btn .bottom-label { font-size: 9px; font-weight: 600; letter-spacing: 0.3px; }
.bottom-btn.active { color: var(--blue); }
.bottom-btn:active { color: var(--text); }

/* Nudge Banner */
.nudge-banner { flex-shrink: 0; background: var(--amber-bg); border-top: 1px solid rgba(210,153,34,0.3); padding: 8px 16px; text-align: center; font-size: 12px; color: var(--amber); font-weight: 500; }

/* Input Panel (slide-up) */
.input-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; display: none; }
.input-overlay.open { display: block; }
.input-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 100; transform: translateY(100%); transition: transform 0.25s ease-out; max-width: 430px; margin: 0 auto; border-radius: var(--radius) var(--radius) 0 0; }
.input-panel.open { transform: translateY(0); }
.input-panel .panel-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.input-panel input[type="text"], .input-panel textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; font-family: var(--font); outline: none; }
.input-panel input[type="text"]:focus, .input-panel textarea:focus { border-color: var(--blue); }
.input-panel input[type="number"] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 20px; font-family: var(--font); outline: none; text-align: center; font-weight: 700; }
.input-panel input[type="number"]:focus { border-color: var(--teal); }
.input-panel textarea { min-height: 60px; resize: vertical; }
.panel-actions { display: flex; gap: 8px; margin-top: 10px; }
.panel-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font); }
.panel-btn.primary { background: var(--green); color: var(--bg); }
.panel-btn.cancel { background: var(--border); color: var(--text-dim); }

/* Choice buttons in input panel */
.choice-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.choice-btn { padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; transition: all 0.15s; font-family: var(--font); }
.choice-btn:active { background: var(--blue-bg); border-color: var(--blue); }
.choice-btn.selected { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.other-input { margin-top: 6px; }

/* Full-screen Views */
.full-view { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.full-view.active { display: flex; }
.view-header { display: flex; align-items: center; padding: 12px 14px; flex-shrink: 0; gap: 12px; border-bottom: 1px solid var(--border); }
.view-header .back-btn { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 4px; }
.view-header h2 { font-size: 17px; font-weight: 700; flex: 1; }
.view-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px; }

/* Add Task Form */
.form-section { margin-bottom: 18px; }
.form-label { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.icon-option { width: 100%; aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: all 0.15s; color: var(--text); }
.icon-option.selected { border-color: var(--blue); background: var(--blue-bg); }
.form-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; font-family: var(--font); outline: none; }
.form-input:focus { border-color: var(--blue); }
.freq-options { display: flex; gap: 6px; }
.freq-btn { flex: 1; padding: 8px 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text-dim); font-size: 11px; font-weight: 600; text-align: center; cursor: pointer; transition: all 0.15s; }
.freq-btn.selected { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }
.day-picker { display: flex; gap: 4px; margin-top: 8px; }
.day-btn { width: 38px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-dim); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.day-btn.selected { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.toggle-row:last-child { border-bottom: none; }
.toggle-label { font-size: 13px; font-weight: 500; }
.toggle-switch { width: 44px; height: 26px; border-radius: 13px; background: var(--border); position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
.toggle-switch.on { background: var(--green); }
.toggle-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.toggle-switch.on::after { transform: translateX(18px); }
.color-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.color-option { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: all 0.15s; }
.color-option.selected { border-color: var(--text); transform: scale(1.15); }
.count-input { width: 60px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; color: var(--text); font-size: 14px; text-align: center; font-weight: 600; outline: none; margin-top: 8px; }
.save-btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius); background: var(--green); color: var(--bg); font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); margin-top: 10px; }
.save-btn:active { opacity: 0.8; }
.delete-task-btn { width: 100%; padding: 12px; border: 1px solid var(--red); border-radius: var(--radius); background: transparent; color: var(--red); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); margin-top: 8px; }
.hide-task-btn { width: 100%; padding: 12px; border: 1px solid var(--amber); border-radius: var(--radius); background: transparent; color: var(--amber); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); margin-top: 8px; }
.choices-tag-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.choices-tag { background: var(--blue-bg); color: var(--blue); font-size: 11px; padding: 3px 8px; border-radius: 6px; display: flex; align-items: center; gap: 4px; }
.choices-tag .remove-tag { cursor: pointer; font-size: 13px; font-weight: 700; }

/* Stats View */
.stats-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 8px; text-align: center; }
.stat-card .stat-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .stat-value { font-size: 22px; font-weight: 700; margin-top: 2px; }
.stat-card .stat-sub { font-size: 10px; color: var(--text-dim); }
.task-stat-row { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.task-stat-row:active { background: var(--border); }
.task-stat-row.hidden-task { opacity: 0.5; }
.task-stat-icon { font-size: 22px; }
.task-stat-info { flex: 1; }
.task-stat-name { font-size: 13px; font-weight: 600; }
.task-stat-meta { font-size: 10px; color: var(--text-dim); margin-top: 1px; }
.avg-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.avg-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.task-stat-avg { font-size: 14px; font-weight: 700; min-width: 40px; text-align: right; }
.section-divider { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 8px; padding-top: 8px; border-top: 1px solid var(--border); }

/* Task Detail */
.detail-hero { text-align: center; padding: 16px 0 8px; }
.detail-hero .detail-icon { font-size: 48px; }
.detail-hero .detail-name { font-size: 20px; font-weight: 700; margin-top: 4px; }
.detail-hero .detail-msg { font-size: 12px; color: var(--text-dim); font-style: italic; margin-top: 6px; padding: 0 20px; }
.detail-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.detail-stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 6px; text-align: center; }
.detail-stat .ds-val { font-size: 20px; font-weight: 700; }
.detail-stat .ds-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
.calendar-month { margin: 16px 0; }
.cal-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
.cal-header button { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 4px 8px; }
.cal-header .cal-title { font-size: 14px; font-weight: 600; min-width: 120px; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
.cal-day-label { font-size: 9px; color: var(--text-dim); font-weight: 600; padding: 4px 0; }
.cal-day { width: 100%; aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--text-dim); }
.cal-day.done { background: var(--green-bg); color: var(--green); }
.cal-day.today { border: 1px solid var(--blue); }
.cal-day.empty { opacity: 0; }
.cal-day.hours { font-size: 8px; color: var(--teal); }
.cal-day.hours.done { background: var(--teal-bg); }
.cal-day.weight { font-size: 7px; color: var(--pink); }
.cal-day.weight.done { background: var(--pink-bg); }

/* Hours/Weight Progress */
.progress-block { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
.progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.progress-label { font-size: 18px; font-weight: 700; }
.progress-goal { font-size: 12px; color: var(--text-dim); }
.progress-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* Notes History */
.notes-section { margin-top: 16px; }
.notes-title { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.note-entry { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
.note-date { font-size: 10px; color: var(--text-dim); font-weight: 600; margin-bottom: 3px; }
.note-text { font-size: 13px; line-height: 1.4; }
.note-choice { font-size: 11px; color: var(--purple); font-weight: 600; margin-bottom: 2px; }

/* Export/Import footer in settings */
.export-section { padding: 14px; text-align: center; }
.export-btn { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 20px; color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer; margin: 4px; font-family: var(--font); }
.export-btn:active { background: var(--border); }
</style>
</head>

<script>
// ══════════════════════════════════════════

const STORAGE_KEY = 'stewardship-os-casey';
const ICON_OPTIONS = [

];
const COLORS = [
  { hex: '#3fb950', bg: 'rgba(63,185,80,0.15)' },
  { hex: '#58a6ff', bg: 'rgba(88,166,255,0.15)' },
  { hex: '#bc8cff', bg: 'rgba(188,140,255,0.15)' },
  { hex: '#d29922', bg: 'rgba(210,153,34,0.15)' },
  { hex: '#f778ba', bg: 'rgba(247,120,186,0.15)' },

  { hex: '#39d2c0', bg: 'rgba(57,210,192,0.15)' },
  { hex: '#f0883e', bg: 'rgba(240,136,62,0.15)' },

const DAY_NAMES = ['S','M','T','W','T','F','S'];
const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const DEFAULT_TASKS = [
  { id:'outside', name:'Outside', icon:'ph-sun', frequency:{type:'daily',count:7,days:null}, requiresNotes:false, hoursTracking:true, hoursGoal:1000, weightTracking:false, weightUnit:null, choices:null, totalDays:1707, baseStreak:0, initialHours:194, hidden:false, createdAt:'2026-03-30', color:'#3fb950', order:0 },
  { id:'water', name:'Water', icon:'ph-drop', frequency:{type:'daily',count:7,days:null}, requiresNotes:false, hoursTracking:false, hoursGoal:null, weightTracking:false, weightUnit:null, choices:null, totalDays:2095, baseStreak:0, initialHours:0, hidden:false, createdAt:'2026-03-30', color:'#58a6ff', order:1 },

  { id:'weight', name:'Weight', icon:'ph-scales', frequency:{type:'weekly',count:1,days:['fri']}, requiresNotes:false, hoursTracking:false, hoursGoal:null, weightTracking:true, weightUnit:'lbs', choices:null, totalDays:0, baseStreak:0, initialHours:0, hidden:false, createdAt:'2026-03-30', color:'#f778ba', order:7 },
];

// ── Google Sheets Sync ──
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwBNocmvrNtOqVHQEU-K-PEV1bHHPJI14-wRSbAeKr-If3EwUlX6f05ZDr4bQUFzswe/exec';

function syncCompletion(date, taskId, record) {
  const task = APP.tasks.find(t => t.id === taskId);
  const payload = {
    type: 'completion',
    date: date,
    taskId: taskId,
    taskName: task ? task.name : taskId,
    done: record.done || false,
    hours: record.hours || '',
    value: record.value || '',
    choice: record.choice || '',
    choiceText: record.choiceText || '',
    notes: record.notes || ''
  };
  fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }).catch(() => {});
}

function syncFullBackup() {
  const payload = { type: 'full-sync', payload: APP };
  fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }).catch(() => {});
}

// ── Data Layer ──
function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    const data = JSON.parse(raw);
    // Migrate: add new fields to existing tasks
    data.tasks.forEach(t => {
      if (t.hidden === undefined) t.hidden = false;
      if (t.choices === undefined) t.choices = null;
      if (t.weightTracking === undefined) t.weightTracking = false;
      if (t.weightUnit === undefined) t.weightUnit = null;
    });
    return data;
  }
  return { tasks: JSON.parse(JSON.stringify(DEFAULT_TASKS)), completions: {} };
}
function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
let APP = loadData();

// ── View State (not persisted) ──
let VIEW = { screen: 'today', selectedDate: todayStr(), detailTaskId: null, calMonth: new Date().getMonth(), calYear: new Date().getFullYear(), editTaskId: null };

// ── Utilities ──
function todayStr() { return new Date().toISOString().slice(0, 10); }
function dateStr(d) { return d.toISOString().slice(0, 10); }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function formatDate(s) {
  const d = parseDate(s);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function getWeekStart(dateString) {
  const d = parseDate(dateString);
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  return dateStr(d);
}

function getDayKey(dateString) {
  const d = parseDate(dateString);
  return DAY_KEYS[d.getDay()];
}

function isTaskDueOnDate(task, dateString) {
  if (task.frequency.type === 'daily') return true;
  if (task.frequency.days) return task.frequency.days.includes(getDayKey(dateString));
  return true;
}

function isCompleted(taskId, dateString) {
  return APP.completions[dateString]?.[taskId]?.done === true;
}

// ── Streak Calculation ──
function calcStreak(task) {
  if (task.frequency.type === 'weekly' && !task.frequency.days) return calcWeeklyStreak(task);
  if (task.frequency.days) return calcSpecificDayStreak(task);
  return calcDailyStreak(task);
}

function calcDailyStreak(task) {
  let streak = 0;
  let d = todayStr();
  if (isCompleted(task.id, d)) streak++;
  d = addDays(d, -1);
  while (d >= task.createdAt) {
    if (!isCompleted(task.id, d)) break;
    streak++;
    d = addDays(d, -1);
  }
  if (d < task.createdAt) streak += (task.baseStreak || 0);
  return streak;
}

function calcSpecificDayStreak(task) {
  // Streak = consecutive due-days completed
  let streak = 0;
  let d = todayStr();
  // Walk backwards, only counting due days
  for (let i = 0; i < 365; i++) {
    const ds = addDays(d, -i);
    if (ds < task.createdAt) break;
    if (!isTaskDueOnDate(task, ds)) continue;
    if (isCompleted(task.id, ds)) streak++;
    else if (ds < todayStr()) break; // skip today if not done yet
    else if (ds === todayStr()) continue; // today not done yet is ok
  }
  if (streak > 0) streak += (task.baseStreak || 0);
  return streak;
}

function calcWeeklyStreak(task) {
  let streak = 0;
  let ws = getWeekStart(todayStr());
  let count = countWeekCompletions(task.id, ws);
  if (count >= task.frequency.count) streak++;
  ws = addDays(ws, -7);
  while (ws >= task.createdAt) {
    count = countWeekCompletions(task.id, ws);
    if (count < task.frequency.count) break;
    streak++;
    ws = addDays(ws, -7);
  }
  if (ws < task.createdAt) streak += (task.baseStreak || 0);
  return streak;
}

function countWeekCompletions(taskId, weekStart) {
  let count = 0;
  for (let i = 0; i < 7; i++) {
    if (isCompleted(taskId, addDays(weekStart, i))) count++;
  }
  return count;
}

function calcTotal(task) {
  let count = task.totalDays || 0;
  for (const [date, dayData] of Object.entries(APP.completions)) {
    if (dayData[task.id]?.done) count++;
  }
  return count;
}

function calcWeeklyProgress(task) {
  const ws = getWeekStart(VIEW.selectedDate);
  let done = 0;
  for (let i = 0; i < 7; i++) {
    if (isCompleted(task.id, addDays(ws, i))) done++;
  }
  return { done, target: task.frequency.count };
}

function calcBattingAvg(task, days) {
  let eligible = 0, completed = 0;
  const t = todayStr();
  for (let i = 0; i < days; i++) {
    const d = addDays(t, -i);
    if (d < task.createdAt) break;
    if (isTaskDueOnDate(task, d)) {
      eligible++;
      if (isCompleted(task.id, d)) completed++;
    }
  }
  return eligible > 0 ? Math.round(completed / eligible * 100) : 0;
}

function calcHoursStats(task) {
  const year = new Date().getFullYear();
  const yearStart = `${year}-01-01`;
  const yearEnd = `${year}-12-31`;
  let yearTotal = task.initialHours || 0;
  let monthTotal = 0;
  const currentMonth = new Date().getMonth();
  for (const [date, dayData] of Object.entries(APP.completions)) {
    if (date >= yearStart && date <= yearEnd && dayData[task.id]?.hours) {
      yearTotal += dayData[task.id].hours;
      if (parseDate(date).getMonth() === currentMonth) monthTotal += dayData[task.id].hours;
    }
  }
  const now = new Date();
  const dayOfYear = Math.floor((now - new Date(year, 0, 0)) / 86400000);
  const daysInYear = ((year % 4 === 0 && year % 100 !== 0) || year % 400 === 0) ? 366 : 365;
  const daysRemaining = daysInYear - dayOfYear;
  const goal = task.hoursGoal || 1000;
  const hoursRemaining = Math.max(0, goal - yearTotal);
  const runRate = daysRemaining > 0 ? (hoursRemaining / daysRemaining) : 0;
  const expectedByNow = goal * (dayOfYear / daysInYear);
  const onTrack = yearTotal >= expectedByNow;
  return { yearTotal, monthTotal, hoursRemaining, runRate, onTrack, goal, daysRemaining };
}

function calcWeightStats(task) {
  const entries = [];
  for (const [date, dayData] of Object.entries(APP.completions)) {
    if (dayData[task.id]?.value !== undefined) {
      entries.push({ date, value: dayData[task.id].value });
    }
  }
  entries.sort((a, b) => a.date.localeCompare(b.date));
  if (entries.length === 0) return { current: null, high: null, low: null, change: null, entries };
  const current = entries[entries.length - 1].value;
  const high = Math.max(...entries.map(e => e.value));
  const low = Math.min(...entries.map(e => e.value));
  const change = entries.length >= 2 ? current - high : null;
  return { current, high, low, change, entries };
}

function getEncouragingMessage(task) {
  const avg30 = calcBattingAvg(task, 30);
  const streak = calcStreak(task);
  let misses = 0;
  const t = todayStr();
  for (let i = 0; i < 3; i++) {
    const d = addDays(t, -i);
    if (d < task.createdAt) break;
    if (isTaskDueOnDate(task, d) && !isCompleted(task.id, d)) misses++;
    else break;
  }
  if (streak >= 84) return 'This is who you are now.';
  if (avg30 >= 85) return 'Faithful stewardship. Keep going.';
  if (avg30 >= 70) return 'Consistent. Keep building.';
  if (misses >= 2) return 'Never miss twice. Try just 2 minutes.';
  return '';
}

// ═══ TODAY VIEW ═══
function renderTodayView(container) {
  const isToday = VIEW.selectedDate === todayStr();
  const isFuture = VIEW.selectedDate > todayStr();
  const dateLabel = isToday ? 'Today' : formatDate(VIEW.selectedDate);

  const hour = new Date().getHours();
  let uncompleted = 0;

  let html = '';
  html += `<div class="date-carousel">
    <button class="date-arrow" onclick="navDate(-1)">&#8249;</button>
    <div class="date-label">${dateLabel}</div>
    <button class="date-arrow ${isFuture || isToday ? 'disabled' : ''}" onclick="navDate(1)">&#8250;</button>
  </div>`;
  if (!isToday) {
    html += `<div class="date-sub"><button onclick="goToToday()" style="background:none;border:none;color:var(--blue);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);">Back to Today</button></div>`;
  }

  html += '<div class="tile-grid">';
  const tasks = [...APP.tasks].filter(t => !t.hidden).sort((a, b) => a.order - b.order);
  tasks.forEach(t => {
    const due = isTaskDueOnDate(t, VIEW.selectedDate);
    const done = isCompleted(t.id, VIEW.selectedDate);
    const streak = calcStreak(t);
    const total = calcTotal(t);
    const wp = calcWeeklyProgress(t);
    const hasNotes = APP.completions[VIEW.selectedDate]?.[t.id]?.notes;
    const choiceMade = APP.completions[VIEW.selectedDate]?.[t.id]?.choice;

    if (isToday && hour >= 17 && due && !done) uncompleted++;

    let statsHtml = '';
    if (t.weightTracking) {
      const ws = calcWeightStats(t);
      if (ws.current !== null) {
        statsHtml = `<div class="tile-weight">${ws.current} ${t.weightUnit || 'lbs'}</div>`;
        if (ws.change !== null && ws.change < 0) {
          statsHtml += `<div class="tile-weekly" style="color:var(--green)">${ws.change.toFixed(1)} from high</div>`;
        } else if (ws.change !== null && ws.change > 0) {
          statsHtml += `<div class="tile-weekly">+${ws.change.toFixed(1)} from low</div>`;
        }
      } else {
        statsHtml = `<div class="tile-weekly">${wp.done}/${wp.target} this wk</div>`;
      }
    } else if (t.hoursTracking) {
      const hs = calcHoursStats(t);
      const todayHours = APP.completions[VIEW.selectedDate]?.[t.id]?.hours || 0;
      statsHtml = `<div class="tile-hours">${Math.round(hs.yearTotal)}h / ${hs.goal}h</div>`;
      if (done) statsHtml += `<div class="tile-weekly">${todayHours}h today</div>`;
      else statsHtml += `<div class="tile-weekly">${wp.done}/${wp.target} this wk</div>`;
    } else {
      if (streak > 0) statsHtml += `<div class="tile-streak">&#128293; ${streak.toLocaleString()}</div>`;
      else if (total > 0) statsHtml += `<div class="tile-total">#${total.toLocaleString()}</div>`;
      statsHtml += `<div class="tile-weekly">${wp.done}/${wp.target} this wk</div>`;
    }

    html += `<div class="tile ${done ? 'done' : ''} ${!due ? 'tile-not-due' : ''}" onclick="tileClick('${t.id}')" style="border-color:${done ? 'var(--green)' : 'var(--border)'}">
      <div class="tile-check">&#10003;</div>
      ${hasNotes ? '<div class="tile-notes-badge"><i class="ph ph-note-pencil"></i></div>' : ''}
      ${choiceMade ? '<div class="tile-notes-badge"><i class="ph ph-list-checks"></i></div>' : ''}
      <div class="tile-icon" style="color:${t.color}"><i class="ph ${t.icon}"></i></div>
      <div class="tile-name">${esc(t.name)}</div>
      <div class="tile-stats">${statsHtml}</div>
    </div>`;
  });
  html += '</div>';

  if (uncompleted > 0 && isToday) {
    html += `<div class="nudge-banner">${uncompleted} left today — try just 2 minutes!</div>`;
  }

  html += renderBottomBar('today');
  container.innerHTML = html;
}

function renderBottomBar(active) {
  return `<div class="bottom-bar">
    <button class="bottom-btn ${active === 'today' ? 'active' : ''}" onclick="navTo('today')"><i class="ph ph-house"></i><span class="bottom-label">Today</span></button>
    <button class="bottom-btn" onclick="navTo('add-task')" style="color:var(--green);font-size:32px;"><i class="ph-fill ph-plus-circle"></i></button>
    <button class="bottom-btn ${active === 'stats' ? 'active' : ''}" onclick="navTo('stats')"><i class="ph ph-chart-bar"></i><span class="bottom-label">Stats</span></button>

  VIEW.selectedDate = dateStr(d);
  render();
}

  if (screen === 'today') VIEW.selectedDate = todayStr();

  render();
}
function navToDetail(taskId) {

// ═══ TILE TAP HANDLER ═══
function tileClick(taskId) {
  const task = APP.tasks.find(t => t.id === taskId);
  if (!task) return;

  if (task.weightTracking) {
    openWeightInput(taskId);
  } else if (task.hoursTracking) {
    openHoursInput(taskId);
  } else if (task.choices && task.choices.length > 0) {
    openChoicesInput(taskId);
  } else if (task.requiresNotes) {
    openNotesInput(taskId);
  } else {
    toggleSimple(taskId);
  }
}

function toggleSimple(taskId) {
  const d = VIEW.selectedDate;
  if (!APP.completions[d]) APP.completions[d] = {};
  if (!APP.completions[d][taskId]) APP.completions[d][taskId] = { done: false };
  APP.completions[d][taskId].done = !APP.completions[d][taskId].done;
  saveData(APP);
  syncCompletion(d, taskId, APP.completions[d][taskId]);
  render();
}

  if (newTask.freqType === 'weekly') {
    html += `<div style="margin-top:8px;display:flex;align-items:center;gap:8px;">
      <input class="count-input" type="number" min="1" max="7" value="${newTask.count}" onchange="newTask.count=parseInt(this.value)||1">
      <span style="font-size:12px;color:var(--text-dim);">times per week (any days)</span></div>`;
  }
  if (newTask.freqType === 'specific') {
    html += `<div class="day-picker">`;
    DAY_KEYS.forEach((dk, i) => {
      const sel = newTask.days.includes(dk);
      html += `<div class="day-btn ${sel ? 'selected' : ''}" onclick="toggleDay('${dk}')">${DAY_NAMES[i]}</div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  // Toggles
  html += `<div class="form-section"><div class="form-label">Options</div>
    <div class="toggle-row"><span class="toggle-label">Requires notes</span>
      <div class="toggle-switch ${newTask.requiresNotes ? 'on' : ''}" onclick="newTask.requiresNotes=!newTask.requiresNotes;render()"></div></div>
    <div class="toggle-row"><span class="toggle-label">Track hours (toward yearly goal)</span>
      <div class="toggle-switch ${newTask.hoursTracking ? 'on' : ''}" onclick="newTask.hoursTracking=!newTask.hoursTracking;if(newTask.hoursTracking)newTask.weightTracking=false;render()"></div></div>`;
  if (newTask.hoursTracking) {
    html += `<div style="margin-top:8px;display:flex;align-items:center;gap:8px;">
      <span style="font-size:12px;color:var(--text-dim);">Yearly goal:</span>
      <input class="count-input" type="number" min="1" value="${newTask.hoursGoal}" onchange="newTask.hoursGoal=parseInt(this.value)||1000"></div>`;
  }
  html += `<div class="toggle-row"><span class="toggle-label">Track weight/measurement</span>
      <div class="toggle-switch ${newTask.weightTracking ? 'on' : ''}" onclick="newTask.weightTracking=!newTask.weightTracking;if(newTask.weightTracking)newTask.hoursTracking=false;render()"></div></div>`;
  if (newTask.weightTracking) {
    html += `<div style="margin-top:8px;display:flex;align-items:center;gap:8px;">
      <span style="font-size:12px;color:var(--text-dim);">Unit:</span>
      <input class="form-input" type="text" style="width:80px;" value="${esc(newTask.weightUnit)}" onchange="newTask.weightUnit=this.value"></div>`;
  }
  html += `</div>`;

  // Choices / Dropdown
  html += `<div class="form-section"><div class="form-label">Choices (optional dropdown when completing)</div>
    <div style="display:flex;gap:6px;">
      <input class="form-input" id="choice-add-input" type="text" placeholder="e.g., At church" value="${esc(newTask.choiceInput)}" oninput="newTask.choiceInput=this.value" onkeydown="if(event.key==='Enter')addChoice()">
      <button class="panel-btn primary" style="flex:0 0 auto;padding:8px 14px;margin:0;font-size:12px;" onclick="addChoice()">Add</button>
    </div>`;
  if (newTask.choices.length > 0) {
    html += `<div class="choices-tag-list">`;
    newTask.choices.forEach((c, i) => {
      html += `<span class="choices-tag">${esc(c)} <span class="remove-tag" onclick="removeChoice(${i})">&#10005;</span></span>`;
    });
    html += `</div>`;
    html += `<div style="font-size:10px;color:var(--text-dim);margin-top:4px;">"Other" option is always included automatically.</div>`;
  }
  html += `</div>`;

  // Color
  html += `<div class="form-section"><div class="form-label">Color</div><div class="color-grid">`;
  COLORS.forEach(c => {
    html += `<div class="color-option ${newTask.color === c.hex ? 'selected' : ''}" style="background:${c.hex}" onclick="newTask.color='${c.hex}';render()"></div>`;
  });
  html += `</div></div>`;

  // Save
  html += `<button class="save-btn" onclick="saveNewTask()">${isEdit ? 'Save Changes' : 'Add Habit'}</button>`;
  if (isEdit) {
    const task = APP.tasks.find(x => x.id === VIEW.editTaskId);
    const isHidden = task?.hidden;
    html += `<button class="hide-task-btn" onclick="toggleHideTask('${VIEW.editTaskId}')">${isHidden ? 'Unhide Habit (show on Today)' : 'Hide Habit (keep data, hide from Today)'}</button>`;
    html += `<button class="delete-task-btn" onclick="deleteTask('${VIEW.editTaskId}')">Delete Habit Forever</button>`;
  }

  html += `</div></div>`;
  container.innerHTML = html;
}

function pickIcon(ic) { newTask.icon = ic; render(); }
function setFreqType(ft) {
  newTask.freqType = ft;
  if (ft === 'daily') newTask.count = 7;
  if (ft === 'weekly' && newTask.count >= 7) newTask.count = 4;
  if (ft === 'specific' && newTask.days.length === 0) newTask.days = ['mon','tue','wed','thu','fri'];
  render();
}
function toggleDay(dk) {
  const idx = newTask.days.indexOf(dk);
  if (idx >= 0) newTask.days.splice(idx, 1);
  else newTask.days.push(dk);
  render();
}
function addChoice() {
  const val = newTask.choiceInput.trim();
  if (!val) return;
  if (!newTask.choices.includes(val)) newTask.choices.push(val);
  newTask.choiceInput = '';
  render();
}
function removeChoice(idx) {
  newTask.choices.splice(idx, 1);
  render();
}

function saveNewTask() {
  const name = newTask.name.trim();
  if (!name) { document.getElementById('task-name-input')?.focus(); return; }

  const freq = {};
  if (newTask.freqType === 'daily') { freq.type = 'daily'; freq.count = 7; freq.days = null; }
  else if (newTask.freqType === 'weekly') { freq.type = 'weekly'; freq.count = newTask.count; freq.days = null; }
  else { freq.type = 'weekly'; freq.count = newTask.days.length; freq.days = [...newTask.days]; }

  const choices = newTask.choices.length > 0 ? [...newTask.choices] : null;

  if (VIEW.editTaskId) {
    const t = APP.tasks.find(x => x.id === VIEW.editTaskId);
    if (t) {
      t.name = name; t.icon = newTask.icon; t.frequency = freq;
      t.requiresNotes = newTask.requiresNotes;
      t.hoursTracking = newTask.hoursTracking;
      t.hoursGoal = newTask.hoursTracking ? newTask.hoursGoal : null;
      t.weightTracking = newTask.weightTracking;
      t.weightUnit = newTask.weightTracking ? newTask.weightUnit : null;
      t.choices = choices;
      t.color = newTask.color;
    }
  } else {
    APP.tasks.push({
      id: uid(), name, icon: newTask.icon, frequency: freq,
      requiresNotes: newTask.requiresNotes,
      hoursTracking: newTask.hoursTracking,
      hoursGoal: newTask.hoursTracking ? newTask.hoursGoal : null,
      weightTracking: newTask.weightTracking,
      weightUnit: newTask.weightTracking ? newTask.weightUnit : null,
      choices,
      totalDays: 0, baseStreak: 0, initialHours: 0, hidden: false,
      createdAt: todayStr(), color: newTask.color,
      order: APP.tasks.length,
    });
  }
  saveData(APP);
  syncFullBackup();
  resetNewTask();
  VIEW.screen = 'today';
  render();
}

function toggleHideTask(taskId) {
  const t = APP.tasks.find(x => x.id === taskId);
  if (t) { t.hidden = !t.hidden; saveData(APP); syncFullBackup(); }
  resetNewTask();
  VIEW.screen = 'today';
  render();
}

function deleteTask(taskId) {
  if (!confirm('Delete this habit forever? All history will be lost.')) return;
  APP.tasks = APP.tasks.filter(t => t.id !== taskId);
  for (const d of Object.keys(APP.completions)) {
    delete APP.completions[d][taskId];
    if (Object.keys(APP.completions[d]).length === 0) delete APP.completions[d];
  }
  saveData(APP);
  syncFullBackup();
  resetNewTask();
  VIEW.screen = 'today';
  render();
}

function cancelAddTask() { resetNewTask(); VIEW.screen = VIEW.editTaskId ? 'stats' : 'today'; render(); }
function resetNewTask() {
  newTask = { icon: 'ph-sun', name: '', freqType: 'daily', count: 7, days: [], requiresNotes: false, hoursTracking: false, hoursGoal: 1000, weightTracking: false, weightUnit: 'lbs', choices: [], choiceInput: '', color: '#3fb950' };
  VIEW.editTaskId = null;
}

function editTask(taskId) {
  VIEW.editTaskId = taskId;
  newTask._loaded = false;
  VIEW.screen = 'add-task';
  render();
}

// ═══ STATS VIEW ═══
function renderStatsView(container) {
  const activeTasks = APP.tasks.filter(t => !t.hidden);
  const hiddenTasks = APP.tasks.filter(t => t.hidden);
  const avg7 = calcOverallAvg(7);
  const avg30 = calcOverallAvg(30);
  const avgAll = calcOverallAvg(365);

  let html = `<div class="full-view active">
    <div class="view-header">
      <button class="back-btn" onclick="navTo('today')"><i class="ph ph-arrow-left"></i></button>
      <h2>Stats</h2>
      <button class="back-btn" style="font-size:16px;" onclick="showExportImport()"><i class="ph ph-gear"></i></button>
    </div>
    <div class="view-body">`;

  html += `<div class="stats-cards">
    <div class="stat-card"><div class="stat-label">7-Day</div><div class="stat-value" style="color:${avgColor(avg7)}">${avg7}%</div></div>
    <div class="stat-card"><div class="stat-label">30-Day</div><div class="stat-value" style="color:${avgColor(avg30)}">${avg30}%</div></div>
    <div class="stat-card"><div class="stat-label">All Time</div><div class="stat-value" style="color:${avgColor(avgAll)}">${avgAll}%</div></div>
  </div>`;

  const renderTaskRow = (t) => {
    const avg = calcBattingAvg(t, 30);
    const streak = calcStreak(t);
    const total = calcTotal(t);
    return `<div class="task-stat-row ${t.hidden ? 'hidden-task' : ''}" onclick="navToDetail('${t.id}')">
      <div class="task-stat-icon" style="color:${t.color}"><i class="ph ${t.icon}"></i></div>
      <div class="task-stat-info">
        <div class="task-stat-name">${esc(t.name)}${t.hidden ? ' <span style="font-size:9px;color:var(--text-dim);">(hidden)</span>' : ''}</div>
        <div class="task-stat-meta">&#128293; ${streak.toLocaleString()} streak &middot; #${total.toLocaleString()} total</div>
        <div class="avg-bar"><div class="avg-bar-fill" style="width:${avg}%;background:${avgColor(avg)}"></div></div>
      </div>
      <div class="task-stat-avg" style="color:${avgColor(avg)}">${avg}%</div>
    </div>`;
  };

  activeTasks.sort((a, b) => a.order - b.order).forEach(t => { html += renderTaskRow(t); });

  if (hiddenTasks.length > 0) {
    html += `<div class="section-divider">Hidden Habits</div>`;
    hiddenTasks.forEach(t => { html += renderTaskRow(t); });
  }

  html += `</div></div>`;
  container.innerHTML = html;
}

function calcOverallAvg(days) {
  let totalEligible = 0, totalDone = 0;
  APP.tasks.filter(t => !t.hidden).forEach(t => {
    for (let i = 0; i < days; i++) {
      const d = addDays(todayStr(), -i);
      if (d < t.createdAt) continue;
      if (isTaskDueOnDate(t, d)) {
        totalEligible++;
        if (isCompleted(t.id, d)) totalDone++;
      }
    }
  });
  return totalEligible > 0 ? Math.round(totalDone / totalEligible * 100) : 0;
}

function avgColor(pct) {
  if (pct >= 85) return 'var(--green)';
  if (pct >= 60) return 'var(--amber)';
  return 'var(--text-dim)';
}

// ═══ TASK DETAIL VIEW ═══
function renderTaskDetail(container) {
  const task = APP.tasks.find(t => t.id === VIEW.detailTaskId);
  if (!task) { navTo('stats'); return; }

  const streak = calcStreak(task);
  const total = calcTotal(task);
  const avg7 = calcBattingAvg(task, 7);
  const avg30 = calcBattingAvg(task, 30);
  const avgAll = calcBattingAvg(task, 365);
  const msg = getEncouragingMessage(task);

  let html = `<div class="full-view active">
    <div class="view-header">
      <button class="back-btn" onclick="navTo('stats')"><i class="ph ph-arrow-left"></i></button>
      <h2>${esc(task.name)}</h2>
      <button class="back-btn" style="font-size:16px;" onclick="editTask('${task.id}')"><i class="ph ph-pencil-simple"></i></button>
    </div>
    <div class="view-body">`;

  html += `<div class="detail-hero">
    <div class="detail-icon" style="color:${task.color}"><i class="ph ${task.icon}"></i></div>
    <div class="detail-name">${esc(task.name)}</div>
    ${msg ? `<div class="detail-msg">${msg}</div>` : ''}
  </div>`;

  // Weight stats
  if (task.weightTracking) {
    const ws = calcWeightStats(task);
    if (ws.current !== null) {
      html += `<div class="detail-stats">
        <div class="detail-stat"><div class="ds-val" style="color:var(--pink)">${ws.current}</div><div class="ds-label">Current ${task.weightUnit || 'lbs'}</div></div>
        <div class="detail-stat"><div class="ds-val">${ws.high}</div><div class="ds-label">High</div></div>
        <div class="detail-stat"><div class="ds-val" style="color:${ws.change !== null && ws.change <= 0 ? 'var(--green)' : 'var(--amber)'}">${ws.change !== null ? (ws.change <= 0 ? ws.change.toFixed(1) : '+' + ws.change.toFixed(1)) : '--'}</div><div class="ds-label">From High</div></div>
      </div>`;
      // Weight trend
      if (ws.entries.length >= 2) {
        html += `<div class="progress-block"><div style="font-size:12px;font-weight:600;margin-bottom:8px;">Weight Trend</div>`;
        ws.entries.slice(-12).forEach(e => {
          html += `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border);">
            <span style="color:var(--text-dim)">${formatDate(e.date)}</span>
            <span style="font-weight:600">${e.value} ${task.weightUnit || 'lbs'}</span>
          </div>`;
        });
        html += `</div>`;
      }
    } else {
      html += `<div class="detail-stats">
        <div class="detail-stat"><div class="ds-val">--</div><div class="ds-label">No entries yet</div></div>
      </div>`;
    }
  } else {
    // Standard stats row
    html += `<div class="detail-stats">
      <div class="detail-stat"><div class="ds-val" style="color:var(--amber)">&#128293; ${streak.toLocaleString()}</div><div class="ds-label">Streak</div></div>
      <div class="detail-stat"><div class="ds-val">#${total.toLocaleString()}</div><div class="ds-label">Total</div></div>
      <div class="detail-stat"><div class="ds-val" style="color:${avgColor(avg30)}">${avg30}%</div><div class="ds-label">30-Day Avg</div></div>
    </div>`;
  }

  // Batting averages (always show)
  html += `<div class="stats-cards">
    <div class="stat-card"><div class="stat-label">7-Day</div><div class="stat-value" style="color:${avgColor(avg7)}">${avg7}%</div></div>
    <div class="stat-card"><div class="stat-label">30-Day</div><div class="stat-value" style="color:${avgColor(avg30)}">${avg30}%</div></div>
    <div class="stat-card"><div class="stat-label">All Time</div><div class="stat-value" style="color:${avgColor(avgAll)}">${avgAll}%</div></div>
  </div>`;

  // Hours progress
  if (task.hoursTracking) {
    const hs = calcHoursStats(task);
    const pct = Math.min(100, Math.round(hs.yearTotal / hs.goal * 100));
    html += `<div class="progress-block">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <div class="progress-label" style="color:var(--teal)">${Math.round(hs.yearTotal)}h</div>
        <div class="progress-goal">/ ${hs.goal.toLocaleString()}h goal</div>
      </div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%;background:var(--teal)"></div></div>
      <div class="progress-sub">${hs.onTrack ? '<span style="color:var(--green)">On track</span>' : '<span style="color:var(--amber)">Behind pace</span>'} &middot; Need ${hs.runRate.toFixed(1)}h/day to hit goal</div>
      <div class="progress-sub">This month: ${Math.round(hs.monthTotal)}h</div>
    </div>`;
  }

  // Calendar
  html += renderCalendar(task);

  // Notes/choices history
  if (task.requiresNotes || (task.choices && task.choices.length > 0)) {
    html += renderNotesHistory(task);
  }

  html += `</div></div>`;
  container.innerHTML = html;
}

function renderCalendar(task) {
  const m = VIEW.calMonth;
  const y = VIEW.calYear;
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const t = todayStr();

  let html = `<div class="calendar-month">
    <div class="cal-header">
      <button onclick="calNav(-1)">&#8249;</button>
      <div class="cal-title">${MONTH_NAMES[m]} ${y}</div>
      <button onclick="calNav(1)">&#8250;</button>
    </div>
    <div class="cal-grid">`;

  DAY_NAMES.forEach(d => { html += `<div class="cal-day-label">${d}</div>`; });

  for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const done = isCompleted(task.id, ds);
    const isT = ds === t;
    const hours = APP.completions[ds]?.[task.id]?.hours;
    const weight = APP.completions[ds]?.[task.id]?.value;

    if (task.hoursTracking && hours) {
      html += `<div class="cal-day hours done ${isT ? 'today' : ''}">${hours}h</div>`;
    } else if (task.weightTracking && weight) {
      html += `<div class="cal-day weight done ${isT ? 'today' : ''}">${weight}</div>`;
    } else if (done) {
      html += `<div class="cal-day done ${isT ? 'today' : ''}">${d}</div>`;
    } else {
      html += `<div class="cal-day ${isT ? 'today' : ''}">${d}</div>`;
    }
  }

  html += '</div></div>';
  return html;
}

function calNav(delta) {
  VIEW.calMonth += delta;
  if (VIEW.calMonth > 11) { VIEW.calMonth = 0; VIEW.calYear++; }
  if (VIEW.calMonth < 0) { VIEW.calMonth = 11; VIEW.calYear--; }
  render();
}

function renderNotesHistory(task) {
  const entries = [];
  for (const [date, dayData] of Object.entries(APP.completions)) {
    const rec = dayData[task.id];
    if (!rec) continue;
    if (rec.notes || rec.choice) {
      entries.push({ date, notes: rec.notes || '', choice: rec.choice || '', choiceText: rec.choiceText || '' });
    }
  }
  entries.sort((a, b) => b.date.localeCompare(a.date));

  if (entries.length === 0) return '';

  let html = `<div class="notes-section"><div class="notes-title">History</div>`;
  entries.slice(0, 30).forEach(e => {
    html += `<div class="note-entry">
      <div class="note-date">${formatDate(e.date)}</div>
      ${e.choice ? `<div class="note-choice">${esc(e.choice)}${e.choiceText ? ': ' + esc(e.choiceText) : ''}</div>` : ''}
      ${e.notes ? `<div class="note-text">${esc(e.notes)}</div>` : ''}
    </div>`;
  });
  html += '</div>';
  return html;
}

// ═══ EXPORT / IMPORT ═══
function showExportImport() {
  const panel = document.getElementById('input-panel');
  const overlay = document.getElementById('input-overlay');
  panel.innerHTML = `
    <div class="panel-title">Data</div>
    <div class="export-section">
      <button class="export-btn" onclick="exportData()"><i class="ph ph-download-simple"></i> Export Backup</button>
      <button class="export-btn" onclick="importData()"><i class="ph ph-upload-simple"></i> Import Backup</button>
    </div>
    <div class="panel-actions">
      <button class="panel-btn cancel" onclick="closeInputPanel()">Close</button>
    </div>`;
  panel.classList.add('open');
  overlay.classList.add('open');
}

function exportData() {
  const blob = new Blob([JSON.stringify(APP, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `stewardship-casey-backup-${todayStr()}.json`;
  a.click();
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        APP = JSON.parse(ev.target.result);
        saveData(APP);
        closeInputPanel();
        render();
        alert('Data imported successfully.');
      } catch (err) { alert('Invalid file.'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

// ═══ LONG PRESS TO EDIT ═══
let longPressTimer = null;
document.addEventListener('touchstart', e => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  const taskId = tile.getAttribute('onclick')?.match(/tileClick\('(.+?)'\)/)?.[1];
  if (!taskId) return;
  longPressTimer = setTimeout(() => { editTask(taskId); longPressTimer = null; }, 600);
}, { passive: true });
document.addEventListener('touchend', () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } });
document.addEventListener('touchmove', () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } });

// ═══ INIT ═══
render();
</script>
</body>
</html>
